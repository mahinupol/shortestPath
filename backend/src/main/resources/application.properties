spring.application.name=smart-city-simulator
server.port=8080

# H2 In-Memory Database Configuration (Default)
spring.datasource.url=jdbc:h2:mem:smartcitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console configuration for debugging / inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Simulation Settings
simulation.tick-rate-ms=1000
simulation.auto-start=true
simulation.city.grid-size=5

# Logging configuration
logging.level.com.smartcity=INFO
logging.level.org.springframework.web=INFO
